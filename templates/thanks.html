<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | {{business}}</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#14161a;font-family:"Archivo",system-ui,sans-serif}
  .box{padding:32px;max-width:560px}
  .num{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(20,22,26,.55)}
  h1{margin:14px 0 10px;font-size:clamp(34px,6vw,64px);font-stretch:118%;letter-spacing:-.03em;line-height:1}
  p{font-size:17px;line-height:1.6;color:rgba(20,22,26,.75)}
  a{color:#14161a;text-decoration:none;border-bottom:1px solid rgba(20,22,26,.4)}
</style>
</head>
<body>
<div class="box">
  <p class="num">Payment received</p>
  <h1>Thank you.</h1>
  <p>Your payment to {{business}} went through and a receipt is on its way from Stripe.{{#if phone}} Questions: {{phone}}.{{/if}} <a href="/">Back to the site</a>.</p>
</div>
</body>
</html>
